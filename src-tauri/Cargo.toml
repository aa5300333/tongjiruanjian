[package]
name = "lottery-financial-manager"
version = "1.0.0"
description = "Lottery Financial Manager App"
authors = ["AI Coding Agent"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "window-all", "system-tray"] }
regex = "1.10"
lazy_static = "1.4"

[features]
# by default Tauri runs in production mode
# check `tauri dev` for local development
custom-protocol = ["tauri/custom-protocol"]
